# Development stack, with hot reload and the source tree mounted. Start it on
# its own — it pulls in the production PocketBase service from compose.yaml:
#
#   docker compose -f compose.dev.yaml up -d --build
#
# Work at http://127.0.0.1:5173. PocketBase stays on http://127.0.0.1:8090,
# which is where the dashboard at /_/ lives — it also serves whatever frontend
# was last built into its image, which is not what you are editing.
#
# The Vite dev server is NOT hardened and must never be reachable beyond
# localhost. See https://vite.dev/config/server-options.

include:
  - compose.yaml

services:
  web:
    build:
      context: .
      target: web-dev
    environment:
      # Vite proxies /api to PocketBase over the internal compose network, so
      # the browser still talks to a single origin.
      PB_PROXY_TARGET: http://pocketbase:8091
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
