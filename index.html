<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <!-- The stylesheet arrives after this file, and until it does the browser
         paints its own default white canvas, which flashes on every reload.
         These tell it the page is dark from the first byte. The colour is
         --background from index.css, which is not defined yet at this point. -->
    <meta name="color-scheme" content="dark" />
    <style>html { background: #101115; }</style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Simple Media Tracker</title>
    <meta name="description" content="A minimal, easy to use, self-hosted media tracker for the movies, shows, games, books, anime and manga you've finished. No metadata lookups, no artwork, no recommendations." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
