# Production stack. `docker compose up --build -d` serves the app on
# http://127.0.0.1:8090, reachable from this machine only.
#
# Requires Docker Compose v2.24 or newer.
#
# One container answers for everything: the built frontend, the REST API and the
# superuser dashboard at /_/. To expose it beyond this machine, put a
# TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front of
# 127.0.0.1:8090 rather than changing WEB_PUBLISH to 0.0.0.0 — see the README.

services:
  pocketbase:
    build:
      context: .
      target: pocketbase
    # Loopback by default. Note that this port also serves the superuser
    # dashboard at /_/, which has full database access: before publishing it
    # anywhere, restrict the dashboard to the addresses you use it from with
    # `superuser ips` — the README's "Putting it on the internet" has the
    # command.
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:8090}:8091"
    volumes:
      # Long syntax so create_host_path can be turned off: a missing ./pb_data
      # would otherwise be created by Docker as root, which this container runs
      # too unprivileged to write. Being told the directory is missing beats
      # debugging a database that will not open.
      - type: bind
        source: ./pb_data
        target: /pb_data
        bind:
          create_host_path: false
    # Must match the owner of ./pb_data on the host. `id -u` / `id -g`.
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8091/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
